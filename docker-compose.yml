version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: school-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: school_db
      MYSQL_USER: school
      MYSQL_PASSWORD: school123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - school-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: school-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: school
      DB_PASS: school123
      JWT_SECRET: school-admin-secret-key-2024-very-long-secret-for-jwt-signing
    ports:
      - "8000:8080"
    networks:
      - school-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: school-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:5173"
    environment:
      - API_URL=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    networks:
      - school-network

volumes:
  mysql_data:

networks:
  school-network:
    driver: bridge
